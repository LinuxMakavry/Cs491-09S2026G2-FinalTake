name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  client:
    name: Client (lint/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test --if-present
      - name: Build
        run: npm run build --if-present

  server:
    name: Server (lint/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt is empty; skipping app deps install."
          fi

      - name: Lint
        run: |
          if ls *.py */*.py */*/*.py 1>/dev/null 2>&1; then
            ruff check .
          else
            echo "No Python files found; skipping ruff."
          fi

            - name: Test
        run: |
          if [ -d app/tests ]; then
            PYTHONPATH=. pytest app/tests/ -q --junitxml=test-results.xml --cov=app --cov-report=term-missing
          else
            echo "No tests found; skipping pytest."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: server/test-results.xml

# SOURCES / REFERENCES:
# - GitHub Actions workflow syntax documentation
#   https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# - actions/checkout, actions/setup-node, actions/setup-python official action docs
#   https://github.com/actions/checkout
#   https://github.com/actions/setup-node
#   https://github.com/actions/setup-python
# - actions/upload-artifact docs: saving CI output files as downloadable artifacts
#   https://github.com/actions/upload-artifact
# - pytest --junitxml flag for machine-readable test results
#   https://docs.pytest.org/en/stable/how-to/output.html#creating-junitxml-format-files
# - Original ci.yml structure from Sprint 1 (Dev E)